<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Kashish Patel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- Header / Navbar -->
    <header>
        <nav>
            <h2 class="logo">Kashish Patel</h2>
            <div class="menu-toggle" id="mobile-menu-btn">
                <i class="fa-solid fa-bars"></i>
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="education.html">Education</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Container for Dynamic Routing -->
    <main id="main-content">
        <section class="page-section reveal active">
            <h1>Contact Me</h1>
            
            <div class="contact-container">
                <!-- Left Column: Contact Cards -->
                <div class="contact-info">
                    <!-- Email Card -->
                    <div class="contact-item">
                        <div class="contact-icon">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <div class="contact-text">
                            <h3>Email</h3>
                            <p>kasupatel0211@gmail.com</p>
                        </div>
                    </div>

                    <!-- Phone Card -->
                    <div class="contact-item">
                        <div class="contact-icon">
                            <i class="fa-solid fa-phone"></i>
                        </div>
                        <div class="contact-text">
                            <h3>Phone</h3>
                            <p>+91 9723065331</p>
                        </div>
                    </div>

                    <!-- Social Icons Box -->
                    <div class="center">
                        <div class="social-icons">
                            <a href="https://github.com/kasupatel0211-ship-it" target="_blank" aria-label="GitHub">
                                <i class="fa-brands fa-github"></i>
                            </a>
                            <a href="https://www.linkedin.com/in/kashish-patel-b0967933a?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" aria-label="LinkedIn">
                                <i class="fa-brands fa-linkedin"></i>
                            </a>
                            <a href="https://leetcode.com/u/kashish0211/" target="_blank" aria-label="LeetCode">
                                <i class="fa-solid fa-code"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Interactive Styled Form -->
                <div class="glass-card">
                    <form class="contact-form">
                        <div class="form-group">
                            <label for="form-name">Name</label>
                            <input type="text" id="form-name" class="form-control" placeholder="Enter your name" required>
                        </div>
                        <div class="form-group">
                            <label for="form-email">Email Address</label>
                            <input type="email" id="form-email" class="form-control" placeholder="name@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="form-message">Your Message</label>
                            <textarea id="form-message" class="form-control" placeholder="Write your message here..." required></textarea>
                        </div>
                        <button type="submit" class="btn form-submit-btn">
                            <i class="fa-solid fa-paper-plane"></i> Send Message
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Kashish Patel. Made with <span>&hearts;</span> in India.</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
